name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 已预装 Android SDK（/usr/local/lib/android/sdk，含平台包且 licenses 已接受）

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RUNTICK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "RUNTICK_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "RUNTICK_STORE_PASSWORD=${{ secrets.RUNTICK_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RUNTICK_KEY_ALIAS=${{ secrets.RUNTICK_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RUNTICK_KEY_PASSWORD=${{ secrets.RUNTICK_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK and AAB
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="${VERSION_NAME#v}" --no-daemon

      - name: Preserve signed release artifacts for verification
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Verify release signature matches existing official APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          curl --fail --location --retry 3 'https://download.runtick.cc/runtick-latest.apk' -o /tmp/previous-official.apk
          "$SIGNER" verify /tmp/previous-official.apk
          "$SIGNER" verify app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify-apk-upgrade.py /tmp/previous-official.apk app/build/outputs/apk/release/app-release.apk

      - name: Require matching Android UI validation before publishing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for ATTEMPT in $(seq 1 60); do
            RESULT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ui-validation.yml --commit "$RELEASE_SHA" --limit 1 --json status,conclusion)
            STATUS=$(echo "$RESULT" | jq -r '.[0].status // "missing"')
            CONCLUSION=$(echo "$RESULT" | jq -r '.[0].conclusion // ""')
            if [ "$STATUS" = completed ]; then
              [ "$CONCLUSION" = success ] || { echo "::error::UI validation concluded $CONCLUSION; release will not be published."; exit 1; }
              exit 0
            fi
            echo "Waiting for UI validation: $STATUS"
            sleep 15
          done
          echo '::error::UI validation did not finish; release will not be published.'
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Sync APK to download repo (official download link)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          APK: app/build/outputs/apk/release/app-release.apk
          VER: ${{ github.ref_name }}
        run: |
          base64 -w0 "$APK" > /tmp/apk.b64
          SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/repos/mtiner/runtick-android-download/contents/public/runtick-latest.apk" | jq -r '.sha // empty')
          for NAME in "runtick-latest.apk" "runtick-${VER#v}.apk"; do
            S=$( [ "$NAME" = "runtick-latest.apk" ] && echo "$SHA" || echo "")
            jq -n --arg msg "release: ${VER} ($NAME)" --arg sha "$S" --rawfile b64 /tmp/apk.b64 \
              '{message:$msg, content:($b64 | gsub("\n"; "")), sha:(if $sha=="" then null else $sha end)}' > /tmp/body.json
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
              --data-binary @/tmp/body.json \
              "https://api.github.com/repos/mtiner/runtick-android-download/contents/public/$NAME")
            echo "$NAME -> HTTP $CODE"
            [ "$CODE" = "201" ] || [ "$CODE" = "200" ] || { cat /tmp/resp.json; exit 1; }
          done
