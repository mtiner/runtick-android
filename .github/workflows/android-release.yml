name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已预装 Android SDK（/usr/local/lib/android/sdk，含平台包且 licenses 已接受）

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "RUNTICK_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "RUNTICK_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RUNTICK_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RUNTICK_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK and AAB
        env:
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PversionName="${VERSION_NAME#v}" --no-daemon

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Sync APK to download repo (official download link)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          APK: app/build/outputs/apk/release/app-release.apk
          VER: ${{ github.ref_name }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null
          B64=$(base64 -w0 "$APK")
          SHA=$(curl -s -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/repos/mtiner/runtick-android-download/contents/public/runtick-latest.apk" | jq -r '.sha // empty')
          for NAME in "runtick-latest.apk" "runtick-${VER#v}.apk"; do
            S=$( [ "$NAME" = "runtick-latest.apk" ] && echo "$SHA" || echo "")
            jq -n --arg msg "release: ${VER} ($NAME)" --arg sha "$S" --arg b64 "$B64" \
              '{message:$msg, content:$b64, sha:(if $sha=="" then null else $sha end)}' > /tmp/body.json
            CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
              --data-binary @/tmp/body.json \
              "https://api.github.com/repos/mtiner/runtick-android-download/contents/public/$NAME")
            echo "$NAME -> HTTP $CODE"
            [ "$CODE" = "201" ] || [ "$CODE" = "200" ] || { cat /tmp/resp.json; exit 1; }
          done
