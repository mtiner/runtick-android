name: Android UI validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify navigation and safe areas on Android 15 with a cutout
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb shell cmd overlay enable com.android.internal.display.cutout.emulation.tall
            ./gradlew connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/cc.runtick.app/files screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-validation
          path: |
            app/build/reports/androidTests/
            screenshots/
